<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的电脑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我的电脑</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <!-- 内联手写鱼，不引外部图片；两条鱼各用独立渐变 id，避免同页 id 冲突 -->
      <svg class="fish" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="fish-side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb457"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs>
        <path d="M12 32c0-8.5 8-15 19-15s19 6.5 19 15-8 15-19 15-19-6.5-19-15z" fill="url(#fish-side)"/>
        <path d="M50 32l9-8v16l-9-8z" fill="#ff8a3d"/>
        <circle cx="24" cy="29" r="2.6" fill="#3b2415"/>
        <path d="M21 38c2.5 2 6 2 8.5 0" stroke="#3b2415" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
      <b>我的电脑</b>
      <span id="count">0 台</span>
    </div>
    <div class="conns" id="conns"></div>
    <div class="sidefoot"><button class="add" id="addBtn" type="button">＋ 添加连接</button></div>
  </aside>

  <main class="pane">
    <div class="pane-head">
      <button class="toggle" id="toggle" type="button" aria-label="收起侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="title">我的电脑</h1>
    </div>
    <div class="pane-body" id="body"></div>
  </main>
</div>

<button class="fab" id="fab" type="button" aria-label="切换连接列表">
  <svg class="fish" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="fish-fab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb457"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs>
    <path d="M12 32c0-8.5 8-15 19-15s19 6.5 19 15-8 15-19 15-19-6.5-19-15z" fill="url(#fish-fab)"/>
    <path d="M50 32l9-8v16l-9-8z" fill="#ff8a3d"/>
    <circle cx="24" cy="29" r="2.6" fill="#3b2415"/>
    <path d="M21 38c2.5 2 6 2 8.5 0" stroke="#3b2415" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg><span>切换</span>
</button>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 添加连接：底部抽屉 -->
<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">添加连接</h2>
      <button class="iconbtn" type="button" data-close="sheet" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="label" id="pairLabel">粘贴配对串</div>
      <textarea class="textarea" id="pairInput" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off" aria-labelledby="pairLabel" placeholder="DSHPAIR1.…"></textarea>
      <div class="hint" id="pairHint">在电脑的 DSH 设置 →「手机访问」里复制配对串，粘上来会自动识别。</div>

      <div class="label">名字</div>
      <input class="input" id="fName" type="text" maxlength="40" placeholder="家里的台式机" aria-label="名字">

      <div class="label">地址</div>
      <input class="input" id="fHost" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="quiet-river-8a2f.trycloudflare.com" aria-label="地址">
      <div class="row"><button class="linkbtn" id="useCurrent" type="button">用当前地址</button></div>

      <div class="label">访问密码</div>
      <input class="input mono" id="fPin" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="48213907" aria-label="访问密码">
      <div class="hint">默认不保存密码；只有打开「记住密码」才会存到这台手机上。</div>
    </div>
    <div class="sheet-foot">
      <button class="btn ghost" type="button" data-close="sheet">取消</button>
      <button class="btn" id="sheetSave" type="button">保存</button>
    </div>
  </section>
</div>

<!-- 改名 / 删除确认 -->
<div class="modal-wrap" id="modalWrap">
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<noscript><p style="padding:24px;font:16px system-ui">这个页面需要 JavaScript 才能用。</p></noscript>
<script src="./app.js"></script>
</body>
</html>
